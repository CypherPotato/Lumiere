<div class="register-wrapper">
  <div class="register-card">

    <a routerLink="/login" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Voltar para o login
    </a>

    <header class="register-header">
      <div class="logo">
        <i class="fa-solid fa-book-open"></i>
        <span>LUMIERE</span>
      </div>

      <h2>Criar conta</h2>
      <p>Preencha seus dados para criar sua conta.</p>
    </header>

    <form class="register-form" (ngSubmit)="cadastrarUsuario()">

      <!-- Nome -->
      <div class="input-group full-width">
        <label for="nome">Nome</label>

        <div class="input-wrapper">
          <i class="fa-regular fa-user input-icon"></i>

          <input
            type="text"
            id="nome"
            name="nome"
            [(ngModel)]="nomeUsuario"
            placeholder="Digite seu nome"
            required
          >
        </div>
      </div>

      <!-- Username -->
      <div class="input-group full-width">
        <label for="username">Username único</label>

        <div class="input-wrapper">
          <i class="fa-solid fa-at input-icon"></i>

          <input
            type="text"
            id="username"
            name="username"
            [(ngModel)]="userName"
            placeholder="Escolha um username"
            required
          >
        </div>
      </div>

      <!-- Senha -->
      <div class="input-group full-width">
        <label for="password">Senha</label>

        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>

          <input
            type="password"
            id="password"
            name="password"
            [(ngModel)]="senha"
            placeholder="Crie uma senha"
            required
          >
        </div>
      </div>

      <button type="submit" class="btn-register">
        Criar conta
      </button>

    </form>

    <footer class="register-footer">
      <p>
        Já tem uma conta?
        <a routerLink="/login">Fazer login</a>
      </p>
    </footer>

  </div>
</div>
